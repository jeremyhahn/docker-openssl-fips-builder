name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  OPENSSL_VERSION: '3.4.1'

jobs:
  build:
    name: Build FIPS Provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t openssl-fips-provider-builder .

      - name: Build FIPS provider
        run: |
          mkdir -p output
          docker run --rm \
            -v $(pwd)/output:/output \
            -e OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
            openssl-fips-provider-builder

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."

          if [ ! -f output/usr/lib/ossl-modules/fips.so ]; then
            echo "ERROR: FIPS module not found"
            exit 1
          fi

          echo "✓ FIPS module exists"
          ls -lh output/usr/lib/ossl-modules/fips.so

          echo ""
          echo "SHA256 checksum:"
          sha256sum output/usr/lib/ossl-modules/fips.so

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fips-provider-${{ env.OPENSSL_VERSION }}
          path: |
            output/usr/lib/ossl-modules/fips.so
          retention-days: 7

  test:
    name: Test FIPS Provider
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: fips-provider-${{ env.OPENSSL_VERSION }}
          path: output

      - name: Verify FIPS module
        run: |
          echo "Verifying FIPS provider module..."

          # Check file exists and is a shared library
          file output/fips.so

          # Check file size is reasonable (should be > 1MB)
          SIZE=$(stat -c %s output/fips.so)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "WARNING: FIPS module seems too small ($SIZE bytes)"
          else
            echo "✓ FIPS module size: $SIZE bytes"
          fi
