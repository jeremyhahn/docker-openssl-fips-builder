name: Release

on:
  push:
    tags:
      - 'v*'

env:
  OPENSSL_VERSION: '3.4.1'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - generating full changelog"
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            echo "Generating changelog from ${PREV_TAG} to ${GITHUB_REF_NAME}"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi

          # Save changelog to file
          cat > CHANGELOG.md << EOF
          ## What's Changed

          ${CHANGELOG}

          ## Installation

          Download the FIPS provider module from the assets below:

          - \`fips.so\` - OpenSSL FIPS provider module (OpenSSL ${OPENSSL_VERSION})
          - \`fips.so.sha256\` - SHA256 checksum

          ### Verify Checksum
          \`\`\`bash
          sha256sum -c fips.so.sha256
          \`\`\`

          ### Usage
          Place the \`fips.so\` module in your OpenSSL modules directory and configure OpenSSL to use the FIPS provider.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}
          EOF

          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
          generate_release_notes: false

  build-fips:
    name: Build FIPS Provider
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t openssl-fips-provider-builder .

      - name: Build FIPS provider
        run: |
          mkdir -p output
          docker run --rm \
            -v $(pwd)/output:/output \
            -e OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
            openssl-fips-provider-builder

      - name: Prepare release assets
        run: |
          VERSION=${{ needs.create-release.outputs.version }}

          # Create release directory
          mkdir -p release

          # Copy fips.so
          cp output/usr/lib/ossl-modules/fips.so release/fips.so

          # Generate SHA256 checksum
          cd release
          sha256sum fips.so > fips.so.sha256

          echo "Release assets:"
          ls -lh
          echo ""
          echo "SHA256 checksum:"
          cat fips.so.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/fips.so
            release/fips.so.sha256

  announce-release:
    name: Announce Release
    needs: [create-release, build-fips]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**OpenSSL Version**: ${{ env.OPENSSL_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`fips.so\` - OpenSSL FIPS provider module" >> $GITHUB_STEP_SUMMARY
          echo "- \`fips.so.sha256\` - SHA256 checksum for verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verify Download" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "sha256sum -c fips.so.sha256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
